[package]
name        = "songs_manager"
version     = "0.1.0"
description = "Songs Manager"
authors     = ["Caio"]
edition     = "2021"

[lib]
name       = "songs_manager_lib"
crate-type = ["rlib"] # "staticlib", "cdylib" are needed for mobile targets

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
rusqlite            = { version = "0.32", features = ["bundled"] }
rfd                 = "0.15"

[profile.release]
codegen-units = 16
lto           = "thin"
opt-level     = 3
panic         = "abort"
strip         = true
